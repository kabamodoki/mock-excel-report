<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帳票Excel生成モック</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    max-width: 560px;
    margin: 40px auto;
    padding: 0 16px;
    color: #222;
    background: #fafafa;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.desc { color: #666; font-size: 13px; margin-top: 0; }
  form {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 24px;
    margin-top: 16px;
  }
  fieldset {
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    margin-bottom: 20px;
    padding: 12px 16px 16px;
  }
  legend { font-size: 13px; font-weight: bold; color: #444; padding: 0 4px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin: 12px 0 4px;
  }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="number"], input[type="file"] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .hint { color: #888; font-size: 12px; margin-top: 4px; }
  button {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
    color: #fff;
    background: #2f6fed;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:disabled { background: #aac0f0; cursor: not-allowed; }
  #status { margin-top: 14px; font-size: 13px; }
  #status.error { color: #c0392b; }
  #status.ok { color: #1b7a3d; }
</style>
</head>
<body>
  <h1>帳票Excel生成モック</h1>
  <p class="desc">
    テンプレート(.xlsx)をアップロードし、4項目を入力すると
    プレースホルダー(<code>${money1}</code> など)を埋めた帳票をダウンロードします。
    テンプレートを指定しない場合はサンプルテンプレートが使われます。
  </p>

  <form id="report-form">
    <fieldset>
      <legend>テンプレート(任意)</legend>
      <label for="template">テンプレートファイル(.xlsx)</label>
      <input type="file" id="template" name="template" accept=".xlsx">
      <p class="hint">
        セル内に <code>${date}</code> <code>${name}</code> <code>${money1}</code> <code>${money2}</code>
        と書いてあれば、セル位置は自由です。未選択の場合はサンプルテンプレートを使用します。
      </p>
    </fieldset>

    <fieldset>
      <legend>埋め込む項目</legend>
      <label for="date">日付</label>
      <input type="text" id="date" name="date" placeholder="例: 2026年09月01日">

      <label for="name">名前</label>
      <input type="text" id="name" name="name" placeholder="例: サンプル株式会社">

      <label for="money1">お金①</label>
      <input type="number" id="money1" name="money1" placeholder="例: 150000">

      <label for="money2">お金②</label>
      <input type="number" id="money2" name="money2" placeholder="例: 32000">

      <p class="hint">空欄のままにするとダミー値が使われます。</p>
    </fieldset>

    <button type="submit" id="submit-btn">帳票を生成してダウンロード</button>
    <div id="status"></div>
  </form>

  <script>
    const form = document.getElementById('report-form');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.className = '';
      statusEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = '生成中...';

      try {
        const formData = new FormData();
        const templateFile = document.getElementById('template').files[0];
        if (templateFile) formData.append('template', templateFile);

        ['date', 'name', 'money1', 'money2'].forEach((key) => {
          const val = document.getElementById(key).value.trim();
          if (val !== '') formData.append(key, val);
        });

        const res = await fetch('/api/report/generate', {
          method: 'POST',
          body: formData,
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `HTTPエラー: ${res.status}`);
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'report.xlsx';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        statusEl.className = 'ok';
        statusEl.textContent = '帳票を生成しました。ダウンロードを確認してください。';
      } catch (err) {
        statusEl.className = 'error';
        statusEl.textContent = 'エラー: ' + err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '帳票を生成してダウンロード';
      }
    });
  </script>
</body>
</html>
